name: publish

# Build each image multi-arch (arm64 + amd64) and push it to GHCR. Runs on
# every push to main that touches the image, on every published release, and on
# demand. Downstream repos build FROM ghcr.io/first-motive/fm-docker:<tag>;
# provisioned hosts run the digest that compose.yaml pins.
#
# The release trigger is the one that gives consumers something to hold on to.
# :humble, :jazzy and :jazzy-gpu move with main, so each names a different image
# after every rebuild, while the version tag a release publishes never moves
# again. Humble keeps the bare vX.Y.Z so existing pins keep their meaning; the
# others carry their tag as a suffix (vX.Y.Z-jazzy).
on:
  push:
    branches: [main]
    paths:
      - Dockerfile.base
      - ros_entrypoint.sh
      - .github/workflows/publish.yml
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: build + push (arm64 + amd64, ${{ matrix.tag }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: humble, target: base, tag: humble, version-suffix: "" }
          - { distro: jazzy, target: base, tag: jazzy, version-suffix: -jazzy }
          - { distro: jazzy, target: gpu, tag: jazzy-gpu, version-suffix: -jazzy-gpu }
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The version comes from the git tag the release was cut from, so a bump
      # happens in one place — the tag — and never in this file.
      - name: Resolve tags
        id: tags
        run: |
          image="ghcr.io/first-motive/fm-docker"
          tags="$image:${{ matrix.tag }}"
          case "$GITHUB_REF" in
            refs/tags/v*) tags="$tags,$image:${GITHUB_REF#refs/tags/}${{ matrix.version-suffix }}" ;;
          esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "publishing: $tags"

      - name: Build + push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.base
          target: ${{ matrix.target }}
          build-args: ROS_DISTRO=${{ matrix.distro }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag }}

      # The digest is what compose.yaml pins, and it is only knowable after the
      # push. Putting it in the job summary saves a registry query when the
      # release notes and the compose pin are written.
      - name: Report the digest
        run: |
          {
            echo "### Published ${{ matrix.tag }}"
            echo ""
            echo "tags: \`${{ steps.tags.outputs.tags }}\`"
            echo ""
            echo "digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
