name: ci

# PR + push validation. Shellcheck the host scripts, build the base image for
# amd64 without pushing, and smoke-test that the ROS runtime and the
# viz/description packages are present. Publishing stays in publish.yml (main +
# image change only); this never pushes.
on:
  pull_request:
    paths-ignore: ["docs/**", "LICENSE", ".gitignore", "plans/**"]
  push:
    branches: [main]
    paths-ignore: ["docs/**", "LICENSE", ".gitignore", "plans/**"]

permissions:
  contents: read

jobs:
  # Rendered files (AGENTS.md, .fm/) come from the render plane and carry a hash of
  # their own body. This fails the PR when one was edited in place.
  drift:
    uses: first-motive/.github/.github/workflows/drift-check.yml@main

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pin the version so CI matches local dev — the runner's bundled
      # shellcheck drifts and flags findings a newer release dropped.
      - name: Install shellcheck 0.11.0
        run: |
          curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            | tar -xJ
          sudo install shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
          shellcheck --version
      - name: Run shellcheck
        run: shellcheck scripts/*.sh run.sh install.sh

  # Piping a script into bash makes bash read it from stdin, which breaks process
  # substitution (no /dev/fd) — the regression that printed "detect_os: command not
  # found". Only a real macOS runner reproduces it; shellcheck cannot. The org
  # workflow pipes each front door in exactly as the docs tell users to.
  curl-smoke:
    uses: first-motive/.github/.github/workflows/bootstrap-selftest.yml@main
    with:
      scripts: run.sh install.sh
      runs-on: '"macos-latest"'

  image:
    name: build amd64 + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build (amd64, no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.base
          platforms: linux/amd64
          push: false
          load: true
          tags: fm-docker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run --rm fm-docker:ci bash -lc '
            set -e
            source "/opt/ros/${ROS_DISTRO}/setup.bash"
            pkgs="$(ros2 pkg list)"
            for p in robot_state_publisher joint_state_publisher xacro foxglove_bridge; do
              echo "$pkgs" | grep -qx "$p" || { echo "missing pkg: $p"; exit 1; }
            done
            command -v xacro >/dev/null || { echo "xacro CLI missing"; exit 1; }
            echo "ROS ${ROS_DISTRO} sourced; description/viz packages present"
          '
