name: ci

# PR + push validation. Shellcheck the host scripts, build each published image
# for amd64 without pushing, and smoke-test that the ROS runtime and the
# viz/description packages are present. Publishing stays in publish.yml (main +
# image change only); this never pushes.
on:
  pull_request:
    paths-ignore: ["docs/**", "LICENSE", ".gitignore", "plans/**"]
  push:
    branches: [main]
    paths-ignore: ["docs/**", "LICENSE", ".gitignore", "plans/**"]

permissions:
  contents: read

jobs:
  # Rendered files (AGENTS.md, .fm/) come from the render plane and carry a hash of
  # their own body. This fails the PR when one was edited in place.
  drift:
    uses: first-motive/.github/.github/workflows/drift-check.yml@main

  # No server-side branch protection exists on this repo, so a push straight to
  # main is possible. The rendered pre-push hook refuses one locally; this
  # notices the ones it cannot refuse and opens an issue naming the commit.
  # The called job guards on push-to-default itself, so it skips on a PR.
  # Job-level permissions replace the workflow-level block for this job alone:
  # opening the issue needs issues:write, which the rest of CI must not have.
  tripwire:
    uses: first-motive/.github/.github/workflows/direct-push-tripwire.yml@main
    permissions:
      contents: read
      issues: write
      pull-requests: read

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Pin the version so CI matches local dev — the runner's bundled
      # shellcheck drifts and flags findings a newer release dropped.
      - name: Install shellcheck 0.11.0
        run: |
          curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            | tar -xJ
          sudo install shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
          shellcheck --version
      - name: Run shellcheck
        run: shellcheck scripts/*.sh run.sh install.sh

  # The release tag appears as a literal wherever a curl|bash reader has no clone
  # to read it from. One pinned value is rendered into scripts/check-tag-refs.sh;
  # this fails the PR when any other literal disagrees with it.
  tag-refs:
    name: tag refs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/check-tag-refs.sh

  # The transport wiring fails silently when it is wrong — the stack starts and
  # nobody hears it — so it is asserted rather than read.
  transport:
    name: compose transport
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/check-compose-transport.sh

  # Piping a script into bash makes bash read it from stdin, which breaks process
  # substitution (no /dev/fd) — the regression that printed "detect_os: command not
  # found". Only a real macOS runner reproduces it; shellcheck cannot. The org
  # workflow pipes each front door in exactly as the docs tell users to.
  curl-smoke:
    uses: first-motive/.github/.github/workflows/bootstrap-selftest.yml@main
    with:
      scripts: run.sh install.sh
      runs-on: '"macos-latest"'

  # One entry per published image; publish.yml carries the same matrix.
  image:
    name: build amd64 + smoke (${{ matrix.tag }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: humble, target: base, tag: humble }
          - { distro: jazzy, target: base, tag: jazzy }
          - { distro: jazzy, target: gpu, tag: jazzy-gpu }
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build (amd64, no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.base
          target: ${{ matrix.target }}
          build-args: ROS_DISTRO=${{ matrix.distro }}
          platforms: linux/amd64
          push: false
          load: true
          tags: fm-docker:ci
          # Scoped per image, or the entries overwrite each other's cache.
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag }}

      - name: Smoke test
        run: |
          docker run --rm fm-docker:ci bash -lc '
            set -e
            source "/opt/ros/${ROS_DISTRO}/setup.bash"
            [ "$ROS_DISTRO" = "${{ matrix.distro }}" ] || { echo "wrong distro: $ROS_DISTRO"; exit 1; }
            pkgs="$(ros2 pkg list)"
            for p in robot_state_publisher joint_state_publisher xacro foxglove_bridge; do
              echo "$pkgs" | grep -qx "$p" || { echo "missing pkg: $p"; exit 1; }
            done
            command -v xacro >/dev/null || { echo "xacro CLI missing"; exit 1; }
            echo "ROS ${ROS_DISTRO} sourced; description/viz packages present"
          '

      # No GPU on the runner, so this checks the image is wired for the NVIDIA
      # toolkit, not that rendering works.
      - name: Smoke test (gpu)
        if: matrix.target == 'gpu'
        run: |
          docker run --rm fm-docker:ci bash -lc '
            set -e
            [ "$NVIDIA_DRIVER_CAPABILITIES" = "compute,graphics,utility" ] || { echo "toolkit env missing"; exit 1; }
            for lib in libEGL.so.1 libGL.so.1 libGLESv2.so.2; do
              ldconfig -p | grep -q "$lib" || { echo "missing lib: $lib"; exit 1; }
            done
            test -f /usr/share/glvnd/egl_vendor.d/10_nvidia.json || { echo "EGL vendor file missing"; exit 1; }
            python3 -m json.tool /usr/share/glvnd/egl_vendor.d/10_nvidia.json >/dev/null || { echo "EGL vendor file is not valid JSON"; exit 1; }
            grep -q libEGL_nvidia.so.0 /usr/share/glvnd/egl_vendor.d/10_nvidia.json || { echo "EGL vendor file does not name libEGL_nvidia"; exit 1; }
            echo "NVIDIA toolkit env and EGL dispatch present"
          '
