# macOS (Apple silicon) overlay — OrbStack. No GPU, no /dev passthrough, no
# hardware. Dev + build + sim + dataset only. Foxglove port published to the host
# so Foxglove Studio on macOS can connect to ws://localhost:8765.
services:
  fm:
    platform: linux/arm64
    ports:
      - "8765:8765"   # foxglove_bridge -> macOS Foxglove Studio
    # No environment block: the transport and the domain come from compose.yaml.
    # This overlay pinned ROS_DOMAIN_ID=0 literally, which ignored the host's own
    # setting — a Mac on a shared LAN then joined a domain it had opted out of.
